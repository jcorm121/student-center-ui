<!doctype html>
<html lang="en" class="scu-extension-enabled" data-scu-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Class Search fixture</title>
    <link rel="stylesheet" href="../src/content/styles.css" />
  </head>
  <body>
    <main>
      <h1>Enrollment: Add Classes</h1>
      <a href="#schedule">My Class Schedule</a>
      <a href="#add">Add</a>
      <a href="#drop">Drop</a>
      <a href="#swap">Swap</a>
      <a href="#edit">Edit</a>
      <a href="#term">Term Information</a>
      <h2>Enter Search Criteria</h2>
      <section>
        <h3>Search for Classes</h3>
        <label for="subject">Subject</label>
        <select id="subject"><option value=""></option><option value="CS">CS - Computer Science</option><option value="MATH">MATH - Mathematics</option></select>
        <label for="course-operator">Course Number</label>
        <select id="course-operator"><option value="exact">is exactly</option><option value="contains">contains</option></select>
        <input aria-label="Course Number value" />
        <label for="career">Course Career</label>
        <select id="career"><option value=""></option><option value="UGRD">Undergraduate</option></select>
        <label for="open-only">Show Open Classes Only</label>
        <input id="open-only" type="checkbox" checked />
        <button type="button">Additional Search Criteria</button>
        <button type="button">Clear</button>
        <button type="button">Search</button>
      </section>
    </main>
    <div id="scu-extension-root"></div>
    <script src="../src/content/schedule.js"></script>
    <script src="../src/content/homepage-data.js"></script>
    <script src="../src/content/enrollment.js"></script>
    <script src="../src/content/dashboard.js"></script>
    <script>globalThis.SCU.dashboard.refresh();</script>
  </body>
</html>
